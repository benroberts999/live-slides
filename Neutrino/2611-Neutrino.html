          # Francis Halzen
          <br>

          <div style="display: flex; justify-content: space-between; align-items: center; gap: 60px; text-align: left">
            <div style="width: 42%; text-align: center">
              <img src="img/Halzen_Nobel.jpeg" style="width: 100%; margin: 0 auto 1px auto">
              <div style="font-size: 16px; line-height: 1.2"><font size="3" class="credit">[Niklas Elmehed, Nobel Prize Outreach]</font></div>
            </div>
            <div style="width: 56%; font-size: 1.5em">
              <h4 style="margin: 0 0 18px 0">• Born 1944, Belgium; PhD Louvain, 1969</h4>
              <h4 style="margin: 0 0 18px 0">• Particle theorist @ CERN, then Wisconsin-Madison</h4>
              <h4 style="margin: 0 0 18px 0">• Co-wrote textbook <i>Quarks and Leptons</i> (1984)</h4>
              <div class="fragment">
              <h4 style="margin: 0 0 18px 0">• <span style="color: cyan">1988</span>: Idea: use Antarctic to search for neutrinos</h4>
              <h4 style="margin: 0 0 18px 0">• <span style="color: cyan">2001</span>: Leads IceCube neutrino observatory</h4>
              </div>
              <div class="fragment">
              <h4 style="margin: 0">• <span style="color: cyan">2026</span>: Nobel prize in physics</h4>
              <h4 style="margin: 0">&emsp;&emsp; • 5th Nobel for neutrinos</h4>
              <h4 style="margin: 0">&emsp;&emsp; • First solo since 1992</h4>
              </div>
            </div>
          </div>

          <div class="fragment" style="margin-top: 30px; text-align: center">
            <h4 style="margin: 0"><i>"I always thought it was a bad idea — I still think so — to have a theorist trying to lead an experiment.

            But actually, in practice, it worked very well. At different stages, I tried to get rid of this job and it never worked."</i></h4>
            <div class="credit" style="font-size: 0.45em">[Halzen for <a href="https://www.aip.org/history/halzen-solo-nobel">AIP, 2026</a>]</div>
          </div>

        </textarea>
        </section>

          # The cosmic-ray problem

          <div style="text-align: center; float: right; width: 42%">
            <br>
            <div class="r-stack">
              <div class="fragment fade-out" data-fragment-index="1" style="width: 100%">
                <img src="img/Hess_balloon.jpg" width="95%" style="margin: 0 auto 1px auto">
                <div style="font-size: 16px; line-height: 1.2"><font size="3" class="credit">Victor Hess, 1912 [VF Hess Society]</font></div>
              </div>
              <div class="fragment fade-in" data-fragment-index="1" style="width: 100%">
                <img src="img/nu-drawing-JohanJarnestadSwedishAcSciences.webp" width="100%" style="margin: 0 0 0 0">
                <div style="font-size: 16px; line-height: 1.2"><font size="3" class="credit">[&copy; Johan Jarnestad / The Royal Swedish Academy of Sciences]</font></div>
                <div class="fragment" data-fragment-index="2">
                  <img src="img/ET.jpg" width="50%" style="margin: 25px auto 1px auto">
                  <div style="font-size: 16px; line-height: 1.2"><font size="3" class="credit">[E.T. / Universal City Studios]</font></div>
                </div>
              </div>
            </div>
          </div>

          <div style="text-align: left; float: left; width: 56%; font-size: 1.5em">
            <br>
            <div style="margin-bottom: 30px">
              <h3 style="margin: 0 0 6px 0"><span style="color: cyan">1912</span> &ensp; <b>Cosmic rays</b>&ensp; <img src="img/nobel-medal.png" style="display: inline; height: 1.4em; margin: 0 0.2em 0 0; vertical-align: middle; background: none; border: none"><span style="color: #ccc">1936</span></h3>
              <h4 style="margin: 0">&emsp;• Particles from space, up to $10^{20}$ eV ($\gg$ LHC)</h4>
              <h4 style="margin: 0">&emsp;• 100+ years on: sources still not understood</h4>
            </div>
            <br>
            <div class="fragment" data-fragment-index="1" style="margin-bottom: 30px">
              <h3 style="margin: 0 0 6px 0"><span style="color: cyan">The problem</span> &ensp; <b>No direction information</b></h3>
              <h4 style="margin: 0">&emsp;• Charged: scatter, bent by magnetic fields in space</h4>
            </div>
            <br>
            <div class="fragment" data-fragment-index="2">
              <h3 style="margin: 0 0 6px 0"><span style="color: cyan">Neutrinos</span> &ensp; <b>Point home</b></h3>
              <h4 style="margin: 0">&emsp;• Born where protons hit gas or light: $p \to \pi^\pm \to \nu$</h4>
              <h4 style="margin: 0">&emsp;• Neutral and <i>extremely</i> weakly interacting</h4>
              <h4 style="margin: 0">&emsp;• They point back to the source</h4>
            </div>
            <h4 class="fragment" data-fragment-index="3" style="margin: 0">&emsp;• But how to find a ghost?</h4>
          </div>

        </textarea>

              <div class="fragment">
              <h4 style="margin: 0; padding-left: 0.8em; text-indent: -0.8em">• Rarely, a neutrino hits a nucleus: a flash of Cherenkov light</h4>
              </div>
              <div class="fragment" style="margin-top: 24px">
                <h4 style="margin: 0 0 10px 0; color: cyan">Main results:</h4>
                <h4 style="margin: 0 0 8px 0; padding-left: 0.8em; text-indent: -0.8em">• <span style="color: cyan">2013</span>: Extragalactic Neutrinos</h4>
                <h4 style="margin: 0 0 8px 0; padding-left: 0.8em; text-indent: -0.8em">• <span style="color: cyan">2017</span>: The first source: a blazar</h4>
                <h4 style="margin: 0 0 8px 0; padding-left: 0.8em; text-indent: -0.8em">• <span style="color: cyan">2022</span>: An active galaxy</h4>
                <h4 style="margin: 0 0 8px 0; padding-left: 0.8em; text-indent: -0.8em">• <span style="color: cyan">2023</span>: The Milky Way in neutrinos</h4>
              <h4 style="margin: 0; padding-left: 0.8em; text-indent: -0.8em">• <span style="color: cyan">Also</span>: oscillations, dark matter, supernovae, geophysics</h4>
              </div>
            </div>
          </div>

              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">1930</span> &ensp; <b>Theorised</b> &ensp; <i style="font-size: 0.7em">"Dear Radioactive Ladies and Gentlemen, ..."</i></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="3">
                <h4 style="margin: 0 0 10px 40px">• Pauli: "desperate remedy": undetectable neutral particle</h4>
                <h4 style="margin: 0 0 10px 40px">• Explain energy conservation in RaE (Bi) $\beta$ decay</h4>
                <h4 class="fragment" data-fragment-index="2" style="margin: 0 0 10px 80px"><i style="font-size: 0.9em">"Unfortunately, I cannot appear in Tubingen personally since I am indispensable here in Zurich because of a ball"</i></h4>
              </div>
            </div>
            <div class="fragment" data-fragment-index="3" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">1933</span> &ensp; <b>Fermi theory</b></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="4">
                <h4 style="margin: 0 0 0px 40px">• Fermi's theory of $\beta$ decay [<a href="https://doi.org/10.1007/BF01351864">Z. Phys. <b>88</b>, 161 (1934)</a>] &ensp; <i style="font-size: 0.8em"></i></h4>
                <h5 style="margin: 0 0 0px 60px"> <i>(rejected by Nature)</i></h5>
                <br>
                <h4 style="margin: 0 0 0px 40px">• Bethe and Peierls: $\sigma \sim 10^{-44}$ cm$^2~~$ [<a href="https://www.nature.com/articles/133532a0">Nature <b>133</b>, 532 (1934)</a>]</h4>
                <h4 style="margin: 0 0 0px 60px"> <i>"no practically possible way of observing"</i></h4>
              </div>
            </div>
            <div class="fragment" data-fragment-index="4" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">1956</span> &ensp; <b>Detected</b> &ensp; <img src="img/nobel-medal.png" style="display: inline; height: 1.4em; margin: 0 0.2em 0 0; vertical-align: middle; background: none; border: none"><span style="color: #ccc">1995</span></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="6">
                <h4 style="margin: 0 0 10px 40px">• Reines and Cowan [<a href="https://www.science.org/doi/10.1126/science.124.3212.103">Science <b>124</b>, 103 (1956)</a>]</h4>
                <h4 style="margin: 0 0 10px 40px">• Reactor $\bar\nu_e$ at Savannah River: \[\large \bar\nu_e + p \to e^+ + n\]</h4>
                <div class="fragment" data-fragment-index="5">
                  <h4 style="margin: 0 0 10px 40px">• $e^+$ annihilates: two 0.511 MeV $\gamma$ flash in the scintillator</h4>
                  <h4 style="margin: 0 0 10px 40px">• $n$ captured on cadmium µs later: a second $\gamma$ flash</h4>
                </div>
              </div>
            </div>

              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">1957</span> &ensp; <b>Parity violation</b> &ensp; <img src="img/nobel-medal.png" style="display: inline; height: 1.4em; margin: 0 0.2em 0 0; vertical-align: middle; background: none; border: none"><span style="color: #ccc">1957</span></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="7">
                <h4 style="margin: 0 0 10px 40px">• Lee and Yang [<a href="https://journals.aps.org/pr/abstract/10.1103/PhysRev.104.254">Phys. Rev. <b>104</b>, 254 (1956)</a>]</h4>
                <h4 style="margin: 0 0 10px 40px">• C. S. Wu: $^{60}$Co $\beta$ decay [<a href="https://journals.aps.org/pr/abstract/10.1103/PhysRev.105.1413">Phys. Rev. <b>105</b>, 1413 (1957)</a>]</h4>
              </div>
            </div>
            <div class="fragment" data-fragment-index="7" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">1962</span> &ensp; <b>Now in more flavours</b> &ensp; <img src="img/nobel-medal.png" style="display: inline; height: 1.4em; margin: 0 0.2em 0 0; vertical-align: middle; background: none; border: none"><span style="color: #ccc">1988</span></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="8">
                <h4 style="margin: 0 0 10px 40px">• $\nu_\mu \neq \nu_e$ at Brookhaven [<a href="https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.9.36">Phys. Rev. Lett. <b>9</b>, 36 (1962)</a>]</h4>
                <h4 style="margin: 0 0 10px 40px">• Pions decay to $\nu$</h4>
                <h4 style="margin: 0 0 10px 40px">• 13 m of steel shielding (old battleships)</h4>
                <h4 style="margin: 0 0 10px 40px">• Spark chamber observes muons, never electrons: new type \[\large \pi^+ \to \mu^+ + \nu_\mu, \qquad \nu_\mu + n \to \mu^- + p\]</h4>
                <h4 style="margin: 0 0 10px 40px">• Doublet structure of leptons</h4>
                <h4 style="margin: 0 0 10px 40px">• $\nu_\tau$ at Fermilab (DONUT), 2000 [<a href="https://doi.org/10.1016/S0370-2693(01)00307-0">Phys. Lett. B <b>504</b>, 218 (2001)</a>]</h4>
              </div>
            </div>
            <div class="fragment" data-fragment-index="8" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">1967</span> &ensp; <b>Electroweak theory</b> &ensp; <img src="img/nobel-medal.png" style="display: inline; height: 1.4em; margin: 0 0.2em 0 0; vertical-align: middle; background: none; border: none"><span style="color: #ccc">1979</span></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="9">
                <h4 style="margin: 0 0 0px 40px">• Glashow, Salam, Weinberg: electroweak unification</h4>
                <h4 style="margin: 0 0 0px 40px">• Carried by $W^\pm$, $Z$ [<a href="https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.19.1264">Phys. Rev. Lett. <b>19</b>, 1264 (1967)</a>]</h4>
                <h4 style="margin: 0 0 0px 40px">• Mass from the Higgs (1964)</h4>
                <h4 style="margin: 0 0 10px 40px">• But $\nu$ only left-handed: so $m_\nu = 0$</h4>
              </div>
            </div>
            <div class="fragment" data-fragment-index="9" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">1968, 1987</span> &ensp; <b>The Sun and a supernova</b> &ensp; <img src="img/nobel-medal.png" style="display: inline; height: 1.4em; margin: 0 0.2em 0 0; vertical-align: middle; background: none; border: none"><span style="color: #ccc">2002</span></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="11">
                <h4 style="margin: 0 0 0px 40px">• Davis's Homestake tank: \[\large \nu_e + {}^{37}{\rm Cl} \to {}^{37}{\rm Ar} + e^-\]</h4>
                <h4 style="margin: 0 0 0px 40px">• Finds $\tfrac13$ of the predicted $\nu_e$ $\implies$ solar neutrino problem</h4>
                <h4 class="fragment" data-fragment-index="10" style="margin: 0 0 10px 40px">• SN1987A: $\sim$25 events in 13 s (Kamiokande-II, IMB, Baksan): <br> $~\implies$ neutrino astronomy works</h4>
              </div>
            </div>
            <div class="fragment" data-fragment-index="11" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">1998–2002</span> &ensp; <b>Oscillating, so massive</b> &ensp; <img src="img/nobel-medal.png" style="display: inline; height: 1.4em; margin: 0 0.2em 0 0; vertical-align: middle; background: none; border: none"><span style="color: #ccc">2015</span></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="12">
                <h4 style="margin: 0 0 0px 40px">• Super-K (atmospheric) and SNO (solar)</h4>

            </div>

              <h4 style="margin: 0 0 10px 40px">• IceCube: TeV–PeV neutrinos from beyond the Galaxy</h4>
            </div>
          </div>

        <section data-markdown>
          <textarea data-template>
          # History of neutrinos
          ### _(their point of view)_

          <div style="text-align: left; float: left; width: calc(40% + 50px); margin-left: -50px; font-size: 1.125em">
            <div class="fragment" data-fragment-index="1" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">$t < 1$ s</span> &ensp; <b>In equilibrium</b></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="2">
                <h4 style="margin: 0 0 10px 40px">• $T > 1$ MeV: weak reactions \[\large \nu\bar\nu \leftrightarrow e^+e^-, \qquad \nu e \leftrightarrow \nu e\]</h4>
                <h4 style="margin: 0 0 10px 40px">• Keep neutrinos thermal with everything else</h4>
              </div>
            </div>
            <div class="fragment" data-fragment-index="2" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">$t \approx 1$ s</span> &ensp; <b>Freeze-out</b></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="3">
                <h4 style="margin: 0 0 10px 40px">• $\Gamma \sim G_F^2 T^5$ falls below $H \sim T^2/M_{\rm Pl}$</h4>
                <h4 style="margin: 0 0 10px 40px">• Neutrinos decouple and free-stream ever after</h4>
              </div>
            </div>
            <div class="fragment" data-fragment-index="3" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">$t \gtrsim$ few s</span> &ensp; <b>Cosmic $\nu$ background</b></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="4">
                <h4 style="margin: 0 0 10px 40px">• $e^+e^-$ annihilation heats only the photons: \[\large T_\nu = (4/11)^{1/3}\, T_\gamma\]</h4>
                <h4 style="margin: 0 0 10px 40px">• Today: $T_\nu \approx 1.95$ K, $\sim$340 cm$^{-3}$</h4>
                <h4 style="margin: 0 0 10px 40px">• $\nu$: never touched again, but felt by gravity</h4>
                <h4 style="margin: 0 0 10px 40px">• 40% of the radiation, speed up the expansion</h4>
                <h4 style="margin: 0 0 10px 40px">• Expansion rate counts species: $N_{\rm eff}$</h4>
                <!-- <h4 style="margin: 0 0 10px 40px">• Structure growth ($\sum m_\nu \lesssim 0.1$ eV)</h4> -->
              </div>
            </div>
            <div class="fragment" data-fragment-index="4" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">$t \approx 3$ min</span> &ensp; <b>Light elements (BBN)</b></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="5">
                <h4 style="margin: 0 0 10px 40px">• $\nu_e$ swap $n \leftrightarrow p$ until 1 s</h4>
                <h4 style="margin: 0 0 10px 40px">• By 3 min, $n/p \approx 1/7$</h4>
                <h4 style="margin: 0 0 10px 40px">• Nearly all neutrons $\to$ $^4$He: 25% by mass</h4>
                <h4 style="margin: 0 0 10px 40px">• More species, faster expansion, more He</h4>
                <h4 style="margin: 0 0 10px 40px">• Limitted in 1977, before LEP found 3</h4>
              </div>
            </div>
            <div class="fragment" data-fragment-index="5" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">$\gtrsim 10^8$ yr</span> &ensp; <b>Stars</b></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="6">
                <h4 style="margin: 0 0 10px 40px">• Two $\nu_e$ per $^4$He made</h4>
                <h4 style="margin: 0 0 10px 40px">• The Sun emits $2\times10^{38}$ $\nu$/s</h4>
                <h4 style="margin: 0 0 10px 40px">• 65 billion cross your thumbnail each second</h4>
                <h4 style="margin: 0 0 10px 40px">• Super-K sees only $^8$B: 1 in $10^4$</h4>
              </div>
            </div>
            <div class="fragment" data-fragment-index="6" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">Core collapse</span> &ensp; <b>Supernovae</b></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="7">
                <h4 style="margin: 0 0 10px 40px">• 99% of energy leaves as $10^{58}$ neutrinos in $\sim$10 s</h4>
              </div>
            </div>
            <div class="fragment" data-fragment-index="7" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">Also</span> &ensp; <b>Everything else</b></h3>
              <div data-fragment-index="8">
                <h4 style="margin: 0 0 10px 40px">• Earth's radioactivity, reactors</h4>
                <h4 style="margin: 0 0 10px 40px">• Cosmic-ray showers</h4>
                <h4 style="margin: 0 0 10px 40px">• Cosmic accelerators (TeV–PeV)</h4>
                <!-- <h4 style="margin: 0 0 10px 40px">• The still-unseen EeV cosmogenic (GZK) flux</h4> -->
              </div>
            </div>
          </div>

            <div class="r-stack">
              <div class="fragment fade-out" data-fragment-index="4" style="width: 100%">

          <div style="text-align: left; float: left; width: 56%; font-size: 1.25em">
            <div style="margin-bottom: 30px">
              <h3 style="margin: 0 0 6px 0"><span style="color: cyan">1998</span> &ensp; <b>Super-K: $\nu_\mu$ from below go missing</b></h3>
              <h4 style="margin: 0">&emsp;• Up-going: about half lost over 13,000 km of Earth</h4>
              <h4 style="margin: 0">&emsp;• Down-going (15 km of air): all there</h4>
              <h4 style="margin: 0 0 0 2.6em; font-size: 0.75em; color: #ccc">&ndash; The loss depends on distance over energy, $L/E$: oscillation</h4>
            </div>
            <div class="fragment" data-fragment-index="1" style="margin-bottom: 30px">
              <h3 style="margin: 0 0 6px 0"><span style="color: cyan">2002</span> &ensp; <b>SNO: the Sun's missing $\nu_e$</b></h3>
              <h4 style="margin: 0">&emsp;• $\nu_e$ only: a third of the solar model</h4>
              <h4 style="margin: 0">&emsp;• All flavours: the full flux. They changed on the way</h4>
              <h4 style="margin: 0 0 0 2.6em; font-size: 0.75em; color: #ccc">&ndash; Ends the "solar neutrino problem", open since Davis (1968)</h4>
            </div>
            <div class="fragment" data-fragment-index="2" style="margin-bottom: 30px">
              <h3 style="margin: 0 0 6px 0"><span style="color: cyan">So</span> &ensp; <b>Neutrinos have mass</b></h3>
              <div style="font-size: 0.85em">$$P(\nu_\mu\to\nu_\mu) \simeq 1 - \sin^2 2\theta\,\sin^2\!\left(\frac{\Delta m^2 L}{4E}\right)$$</div>
              <h4 style="margin: 0">&emsp;• $\Delta m^2_{21} \approx 7.5\times10^{-5}$ eV$^2$, $|\Delta m^2_{31}| \approx 2.5\times10^{-3}$ eV$^2$</h4>
              <h4 style="margin: 0 0 0 2.6em; font-size: 0.75em; color: #ccc">&ndash; At least two masses non-zero: $\sum m_\nu \gtrsim 0.06$ eV</h4>
              <h4 style="margin: 0">&emsp;• The Standard Model said zero: the first crack</h4>
            </div>
            <div class="fragment" data-fragment-index="3">
              <h3 style="margin: 0 0 6px 0"><span style="color: cyan">Open</span> &ensp; <b>How light, which order, what kind?</b></h3>
              <h4 style="margin: 0">&emsp;• KATRIN: $m_\nu < 0.45$ eV; cosmology: $\sum m_\nu < 0.064$ eV</h4>

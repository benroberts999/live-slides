        <!--      Fig 1: cosmic-history timeline with "ν decouple, t = 1 s" marked beside "CMB, 380 kyr" (ESA/Planck or NASA/WMAP). Fig 2: the Sun imaged in neutrinos (Super-Kamiokande; APOD 5 Jun 1998, R. Svoboda and K. Gordan) -->
        <!--      Alts: SN1987A remnant (HST); Bahcall solar-neutrino spectrum; Γ/H vs T sketch; T_ν vs T_γ through e+e- annihilation -->
        <section data-markdown>
          <textarea data-template>
          # History of neutrinos
          ### _(their point of view)_

          <div style="text-align: left; float: left; width: 56%; font-size: 0.75em">
            <br>
            <div class="fragment">
              <h3 style="margin: 0"><span style="color: cyan">$t < 1$ s</span> &ensp; <b>In equilibrium</b></h3>
              <h4 style="margin: 0 0 10px 0">&emsp;• $T > 1$ MeV: weak reactions ($\nu\bar\nu \leftrightarrow e^+e^-$, $\nu e \leftrightarrow \nu e$) keep neutrinos thermal with everything else</h4>
            </div>
            <br>
            <div class="fragment">
              <h3 style="margin: 0"><span style="color: cyan">$t \approx 1$ s</span> &ensp; <b>Freeze-out</b></h3>
              <h4 style="margin: 0 0 10px 0">&emsp;• $\Gamma \sim G_F^2 T^5$ falls below $H \sim T^2/M_{\rm Pl}$: neutrinos decouple and free-stream ever after</h4>
            </div>
            <br>
            <div class="fragment">
              <h3 style="margin: 0"><span style="color: cyan">$t \approx$ few s</span> &ensp; <b>Left out in the cold</b></h3>
              <h4 style="margin: 0 0 10px 0">&emsp;• $e^+e^-$ annihilation reheats the photons, not the neutrinos: $T_\nu = (4/11)^{1/3}\, T_\gamma$</h4>
            </div>
            <br>
            <div class="fragment">
              <h3 style="margin: 0"><span style="color: cyan">$t \approx 3$ min</span> &ensp; <b>Set the helium</b></h3>
              <h4 style="margin: 0 0 10px 0">&emsp;• The same weak reactions freeze $n/p \approx 1/7$ $\Rightarrow$ 25% $^4$He by mass (BBN)</h4>
            </div>
            <br>
            <div class="fragment">
              <h3 style="margin: 0"><span style="color: cyan">$\gtrsim 10^8$ yr</span> &ensp; <b>Stars</b></h3>
              <h4 style="margin: 0 0 10px 0">&emsp;• Two $\nu_e$ per $^4$He made; the Sun emits $2\times10^{38}$ $\nu$/s: 65 billion cross your thumbnail each second</h4>
            </div>
            <br>
            <div class="fragment">
              <h3 style="margin: 0"><span style="color: cyan">Core collapse</span> &ensp; <b>Supernovae</b></h3>
              <h4 style="margin: 0 0 10px 0">&emsp;• 99% of $3\times10^{53}$ erg leaves as $10^{58}$ neutrinos in $\sim$10 s, and they help drive the explosion</h4>
            </div>
            <br>
            <div class="fragment">
              <h3 style="margin: 0"><span style="color: cyan">Today</span> &ensp; <b>Cosmic neutrino background</b></h3>
              <h4 style="margin: 0 0 10px 0">&emsp;• $T_\nu \approx 1.95$ K, $\sim$340 cm$^{-3}$; never directly detected, but felt via $N_{\rm eff} \approx 3.04$ (CMB) and structure growth ($\sum m_\nu \lesssim 0.1$ eV)</h4>
            </div>
            <br>
            <div class="fragment">
              <h3 style="margin: 0"><span style="color: cyan">Also</span> &ensp; <b>Everything else</b></h3>
              <h4 style="margin: 0 0 10px 0">&emsp;• Earth's radioactivity, reactors, cosmic-ray showers, cosmic accelerators (TeV–PeV), and the still-unseen EeV cosmogenic (GZK) flux</h4>
            </div>
            <br>
            <h4 class="fragment" style="margin: 12px 0 0 0">&emsp;<b>The most abundant matter particle, and the oldest relic: nothing has touched one since the first second</b></h4>
          </div>

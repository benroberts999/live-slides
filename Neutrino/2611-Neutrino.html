        <!--      Fig 1: cosmic-history timeline with "ν decouple, t = 1 s" marked beside "CMB, 380 kyr" (ESA/Planck or NASA/WMAP). Fig 2: the Sun imaged in neutrinos (Super-Kamiokande; APOD 5 Jun 1998, R. Svoboda and K. Gordan) -->
        <!--      Alts: SN1987A remnant (HST); Bahcall solar-neutrino spectrum; Γ/H vs T sketch; T_ν vs T_γ through e+e- annihilation -->
        <section data-markdown>
          <textarea data-template>
          # History of neutrinos
          ### _(their point of view)_

          <div style="text-align: left; float: left; width: 56%; font-size: 0.75em">
            <br>
            <div class="fragment">
              <h3 style="margin: 0 0 6px 0"><span style="color: cyan">$t < 1$ s</span> &ensp; <b>In equilibrium</b></h3>
              <h4 style="margin: 0 0 10px 0">&emsp;• $T > 1$ MeV: weak reactions ($\nu\bar\nu \leftrightarrow e^+e^-$, $\nu e \leftrightarrow \nu e$) keep neutrinos thermal with everything else</h4>
            </div>
            <br>
            <div class="fragment">
              <h3 style="margin: 0 0 6px 0"><span style="color: cyan">$t \approx 1$ s</span> &ensp; <b>Freeze-out</b></h3>
              <h4 style="margin: 0 0 10px 0">&emsp;• $\Gamma \sim G_F^2 T^5$ falls below $H \sim T^2/M_{\rm Pl}$: neutrinos decouple and free-stream ever after</h4>
            </div>
            <br>
            <div class="fragment">
              <h3 style="margin: 0 0 6px 0"><span style="color: cyan">$t \approx$ few s</span> &ensp; <b>Left out in the cold</b></h3>
              <h4 style="margin: 0 0 10px 0">&emsp;• $e^+e^-$ annihilation reheats the photons, not the neutrinos: $T_\nu = (4/11)^{1/3}\, T_\gamma$</h4>
            </div>
            <br>
            <div class="fragment">
              <h3 style="margin: 0 0 6px 0"><span style="color: cyan">$t \approx 3$ min</span> &ensp; <b>Set the helium</b></h3>
              <h4 style="margin: 0 0 10px 0">&emsp;• The same weak reactions freeze $n/p \approx 1/7$ $\Rightarrow$ 25% $^4$He by mass (BBN)</h4>
            </div>
            <br>
            <div class="fragment">
              <h3 style="margin: 0 0 6px 0"><span style="color: cyan">$\gtrsim 10^8$ yr</span> &ensp; <b>Stars</b></h3>
              <h4 style="margin: 0 0 10px 0">&emsp;• Two $\nu_e$ per $^4$He made; the Sun emits $2\times10^{38}$ $\nu$/s: 65 billion cross your thumbnail each second</h4>
            </div>
            <br>
            <div class="fragment">

            <div style="border: 2px dashed #888; border-radius: 10px; height: 330px; width: 90%; margin: 0 auto 28px auto; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 0.65em; padding: 0 24px; box-sizing: border-box">
              <div>Image 1 &mdash; Cartoon: dark matter captured in the Sun, sinking to the core and annihilating; only the neutrinos escape to IceCube</div>
            </div>
            <div style="border: 2px dashed #888; border-radius: 10px; height: 330px; width: 90%; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 0.65em; padding: 0 24px; box-sizing: border-box">

            <br>
            <div class="fragment">
              <h3 style="margin: 0 0 6px 0"><span style="color: cyan">The Sun</span> &ensp; <b>A dark matter trap</b></h3>
              <h4 style="margin: 0 0 0px 0">&emsp;• Dark matter scatters off nuclei, loses energy, is captured, and sinks to the core</h4>
              <h4 style="margin: 0 0 0px 0">&emsp;• It builds up and annihilates: only neutrinos escape, at GeV&ndash;TeV (fusion gives MeV)</h4>
              <h4 style="margin: 0 0 10px 0">&emsp;• Capture rate $\propto$ scattering cross-section: an <i>indirect</i> search measures a <i>direct-detection</i> quantity</h4>
            </div>
            <br>
            <div class="fragment">
              <h3 style="margin: 0 0 6px 0"><span style="color: cyan">Spin</span> &ensp; <b>Hydrogen is the target</b></h3>
              <h4 style="margin: 0 0 0px 0">&emsp;• The Sun is mostly protons: probes spin-dependent DM&ndash;proton scattering</h4>
              <h4 style="margin: 0 0 10px 0">&emsp;• Among the strongest limits there, alongside PICO and Super-K; the Earth's core (iron) probes spin-independent</h4>
            </div>
            <br>

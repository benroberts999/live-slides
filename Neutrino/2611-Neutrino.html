          # History of neutrinos
          ### _(their point of view)_

          <div style="text-align: left; float: left; width: calc(40% + 50px); margin-left: -50px; font-size: 1.125em">  <!-- margin-left: shifts the text into the slide margin; width grows by the same, so the right edge stays put -->
            <div class="fragment" data-fragment-index="1" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">$t < 1$ s</span> &ensp; <b>In equilibrium</b></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="2">
                <h4 style="margin: 0 0 10px 40px">• $T > 1$ MeV: weak reactions \[\large \nu\bar\nu \leftrightarrow e^+e^-, \qquad \nu e \leftrightarrow \nu e\]</h4>
                <h4 style="margin: 0 0 10px 40px">• Keep neutrinos thermal with everything else</h4>
              </div>
            </div>
            <div class="fragment" data-fragment-index="2" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">$t \approx 1$ s</span> &ensp; <b>Freeze-out</b></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="3">
                <h4 style="margin: 0 0 10px 40px">• $\Gamma \sim G_F^2 T^5$ falls below $H \sim T^2/M_{\rm Pl}$</h4>
                <h4 style="margin: 0 0 10px 40px">• Neutrinos decouple and free-stream ever after</h4>
              </div>
            </div>
            <div class="fragment" data-fragment-index="3" style="margin-bottom: 26px">
              <h3 style="margin: 0 0 6px 0; font-size: 1.33em"><span style="color: cyan">$t \gtrsim$ few s</span> &ensp; <b>Cosmic $\nu$ background</b></h3>
              <div class="fragment fade-out fold-away" data-fragment-index="4">
                <!-- 1 Nov: "Photons reheat" (few s) and "Cosmic ν background" (was "Today", then "Ever since", after BBN) merged here; Ben: they repeated each other -->
                <h4 style="margin: 0 0 10px 40px">• $e^+e^-$ annihilation heats only the photons: \[\large T_\nu = (4/11)^{1/3}\, T_\gamma\]</h4>
                <h4 style="margin: 0 0 10px 40px">• Today: $T_\nu \approx 1.95$ K, $\sim$340 cm$^{-3}$</h4>
                <!-- 41%: ρ_ν/ρ_γ = (7/8)(4/11)^{4/3} N_eff = 0.227 × 3.044 = 0.69, so ν are 0.69/1.69 = 41% of the radiation after e+e- annihilation (more before). Friedmann: H² = (8πG/3) ρ, so extra light species ⇒ faster expansion. N_eff = 3.044 in the SM (slightly above 3: ν still a little coupled during e+e- annihilation); Planck 2018: 2.99 ± 0.17 -->
                <h4 style="margin: 0 0 10px 40px">• $\nu$: never touched again, but felt by gravity</h4>
                <h4 style="margin: 0 0 10px 40px">• 40% of the radiation, speed up the expansion</h4>

                <!-- Species: faster expansion ⇒ earlier freeze-out ⇒ more n ⇒ more He, ΔY_p ≈ 0.013 per extra species (from memory). Steigman, Schramm & Gunn, Phys. Lett. B 66, 202 (1977): helium limits the number of neutrino types; LEP/SLC (1989): 3 light ν from the Z width. A 1984 "N_ν ≤ 4" bound (Yang et al., ApJ 281, 493) is often quoted; not checked, so not on the slide -->
                <h4 style="margin: 0 0 10px 40px">• $\nu_e$ swap $n \leftrightarrow p$ until 1 s</h4>
                <h4 style="margin: 0 0 10px 40px">• By 3 min, $n/p \approx 1/7$</h4>
                <h4 style="margin: 0 0 10px 40px">• Nearly all neutrons $\to$ $^4$He: 25% by mass</h4>
                <h4 style="margin: 0 0 10px 40px">• More species, faster expansion, more He</h4>

                <h4 style="margin: 0 0 10px 40px">• 65 billion cross your thumbnail each second</h4>
